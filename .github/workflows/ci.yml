name: Verificações
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: Testes e lint da API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --dev --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - name: Testes das ferramentas Founder (somente em PR)
        run: uv run python -m unittest discover -s ../../.claude/tests -p 'test_*.py' -v
      # Dependency audits share the existing PR job; no extra workflow per commit.
      - name: Auditoria de dependências Python (produção)
        run: |
          uv export --locked --no-dev --no-hashes -o "$RUNNER_TEMP/alinha-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/alinha-requirements.txt"
  web:
    name: Build e lint do site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:local
      - run: npm run lint
      - run: npm run build
      - name: Auditoria de dependências web (produção)
        run: npm audit --omit=dev --audit-level=moderate
