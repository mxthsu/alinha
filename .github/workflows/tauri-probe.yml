name: Tauri Rust Desktop Proof (Windows)

on:
  pull_request:
    paths:
      - 'apps/desktop/tauri-probe/**'
      - 'apps/web/**'
      - '.github/workflows/tauri-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-source-check:
    name: Tauri shell / Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Export the existing React application
        working-directory: apps/web
        env:
          ALINHA_DESKTOP_EXPORT: '1'
        run: npm run build
      - name: Validate isolated Rust host logic
        run: cargo test --manifest-path apps/desktop/tauri-probe/host-core/Cargo.toml
      - name: Compile Tauri Rust shell with Windows prerequisites
        run: cargo check --manifest-path apps/desktop/tauri-probe/src-tauri/Cargo.toml
