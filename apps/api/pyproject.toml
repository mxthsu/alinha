[project]
name = "alinha-api"
version = "0.1.0"
description = "API de análise de currículos com evidências verificáveis para o Alinha"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.18,<1.0",
  "pydantic>=2.9,<3.0",
  "google-genai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1,<2",
  "pyjwt[crypto]>=2.10,<3",
  "keyring>=25,<27",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0", "ruff>=0.13,<1.0"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
